<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полипрагмазия-контроль</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #14426b; text-align: center; }
        p { font-size: 18px; }
        textarea { width: 100%; height: 120px; font-size: 18px; padding: 10px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; font-size: 20px; background: #14426b; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #0e3252; }
        .warning { background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💊 Полипрагмазия-контроль</h1>
        <div class="warning">
            <strong>Внимание:</strong> Это учебный прототип. Он не заменяет врача и не отменяет лечение.
        </div>
        <p>Введите названия препаратов через запятую (например: <i>ибупрофен, варфарин, диазепам</i>):</p>
        <form action="/check" method="post">
            <textarea name="medications" required placeholder="Введите список..."></textarea>
            <button type="submit">Проверить список</button>
        </form>
    </div>
</body>
</html>
